# We have some basic localization support.
# We support "en_US", "tr", "ru", and "es"
lang: en_US

allow_infinite_effects: false

empty_effect_icon: true

player_head_drops: true

brewing_gui: true

# If true, players will drop effects when they die from any cause.  If false, they need to be killed by another player.
drop_on_natural_death: true

#
# Ritual configs
#
rituals:
  # Ritual duration in seconds
  duration: 600 # 10 minutes
  # Ender effect ritual duration in seconds
  ender_duration: 3600 # 1 hour
  # If true, broadcasts the location of the brewing stand when crafting a regular effect.
  broadcast_regular: true
  # If true, will attempt to send a discord webhook to the specified url
  send_webhooks: false
  webhook_url: ""
  # Whether to show an ender crystal beam at the ritual's location.
  beacon: true
  # If set to false, rituals will be canceled when the brewing stand is broken.
  immortal_brewing_stands: true

# Determines what effect is dropped.
# "random" = Drops effect 1 or 2 at random.  If no effect is in the random slot, it will drop the effect in the other slot.
# "prefer_1" = Drops the effect in slot 1.  If no effect is in slot 1, it will drop the effect in slot 2.
# "prefer_2" = Drops the effect in slot 2.  If no effect is in slot 2, it will drop the effect in slot 1.
# "only_1" = Drops the effect in slot 1.  If no effect is in slot 1, nothing happens.
# "only_2" = Drops the effect in slot 2.  If no effect is in slot 2, nothing happens.
# "none" = No effects will drop
effect_drops: random

# The number of seconds that it takes for 1 hit to be removed from the hit timer.
# This is primarily used to trigger the "on ten hit" abilities of each effect.
# To trigger them, you need to hit your target 10 times with the specified number of seconds
hit_counter_decay_seconds: 15

join_effects_enabled: false

join_effects:
  - ocean
  - emerald
  - fire
  - speed

#
# BetterTeams configs
#
betterteams:
  enabled: false
  trust_allies: false


# First number is the augmented limit, the second is the regular limit
# Set to -1 to disable the limit
craft_limits:
  emerald:  [1, 3]
  ender:    [1, 3]
  feather:  [1, 3]
  fire:     [1, 3]
  frost:    [1, 3]
  haste:    [1, 3]
  heart:    [1, 3]
  invis:    [1, 3]
  ocean:    [1, 3]
  regen:    [1, 3]
  speed:    [1, 3]
  strength: [1, 3]
  thunder:  [1, 3]
  apophis:  [1, 3]
  thief:    [1, 3]

#
# To blacklist from using a ability in a certain world, in the 'blacklisted_worlds:' in,
# your chosen effect, add the world's name (The EXACT name) to the list.
#

# Full cooldown is duration + cooldown
emerald:
  cooldown:
    default: 91
    augmented: 76
  duration:
    default: 30
    augmented: 35
  passive:
    xp_stolen_per_hit: 15
    xp_stolen_percent: 1
    percent_xp_to_share: 0.5
    lock_duration_seconds: 10
    looting_level: 5
    xp_multiplier: 2
  spark:
    xp_multiplier: 4
  blacklisted_worlds: []

