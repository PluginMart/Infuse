name: Infuse
version: '$version'
main: com.catadmirer.infuseSMP.Infuse
api-version: '1.21.4'
authors: [CatAdmirer, TurboJax, duff_mans_jnr]
softdepend: [PlaceholderAPI, WorldGuard, BetterTeams]
contributors: [RealKai295, melut42]
libraries:
- com.h2database:h2:$h2Version
commands:
  infuse:
    description: Base command for Infuse
    usage: /infuse help
  lspark:
    description: Activates the first ability.
    usage: /lspark
  rspark:
    description: Activates the second ability.
    usage: /rspark
  ldrain:
    description: Drains the first ability.
    usage: /ldrain
  rdrain:
    description: Drains the second ability.
    usage: /rdrain
  swap:
    description: Swaps the effects between slots 1 and 2.
    usage: /swap
  trust:
    description: Trust a player
    usage: /trust <player>
  untrust:
    description: Untrust a player
    usage: /untrust <player>
  draw:
    description: Draws a line between two coordinates
    usage: /draw <x1> <y1> <z1> <x2> <y2> <z2>
permissions:
  infuse.commands.infuse.gui:
    description: Allows players to use `/infuse gui`
    default: op
  infuse.commands.infuse.reload:
    description: Allows players to use `/infuse reload`
    default: op
  infuse.commands.infuse.reroll:
    description: Allows players to use `/infuse reroll`
    default: op
  infuse.commands.infuse.recipes:
    description: Allows players to use `/infuse recipes`
    default: true
  infuse.commands.infuse.giveEffect:
    description: Allows players to use `/infuse giveEffect`
    default: op
  infuse.commands.infuse.setEffect:
    description: Allows players to use `/infuse setEffect`
    default: op
  infuse.commands.infuse.clearEffects:
    description: Allows players to use `/infuse clearEffects`
    default: op
  infuse.commands.infuse.getTrusted:
    description: Allows players to use `/infuse getTrusted`
    default: true
  infuse.commands.infuse.cooldown:
    description: Allows players to use `/infuse cooldown`
    default: op
  infuse.commands.infuse.controls:
    description: Allows players to use `/infuse controls`
    default: true
  infuse.commands.drain:
    description: Allows players to use `/ldrain` and `/rdrain`
    default: true
  infuse.commands.draw:
    description: Allows players to use `/draw`
    default: true
  infuse.commands.spark:
    description: Allows players to use `/lspark` and `/rspark`
    default: true
  infuse.commands.swap:
    description: Allows players to use `/swap`
    default: true
  infuse.commands.trust:
    description: Allows players to use `/trust` and `/untrust`
    default: true
